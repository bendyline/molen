<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Molen — Sky observatory</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #edf1f7; background: #060c18; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
      main { position: relative; margin: 28px; padding: 24px; width: 340px; max-height: calc(100vh - 56px); overflow: auto; border: 1px solid #ffffff28; border-radius: 16px; background: #0a1424dc; backdrop-filter: blur(18px); }
      a { color: #b7d5ed; font-size: 12px; text-decoration: none; }
      .eyebrow { margin: 22px 0 6px; color: #f4bc83; letter-spacing: .18em; font-size: 10px; text-transform: uppercase; }
      h1 { font-weight: 450; font-size: 30px; margin: 0 0 10px; letter-spacing: -.04em; }
      p { color: #aebfd4; font-size: 12px; line-height: 1.6; }
      label { display: block; font-size: 11px; color: #b8c8da; margin: 15px 0 6px; }
      input, select, button { width: 100%; border-radius: 7px; padding: 9px; border: 1px solid #ffffff30; background: #142338; color: #edf1f7; font: inherit; font-size: 12px; }
      button { cursor: pointer; }
      button:hover { background: #2a3d52; }
      .row { display: flex; gap: 10px; }
      .row > * { flex: 1; min-width: 0; }
      .actions { margin-top: 12px; }
      output { display: block; white-space: pre-line; color: #d9e5f2; font: 11px/1.8 ui-monospace, monospace; border-top: 1px solid #ffffff20; margin-top: 20px; padding-top: 14px; }
      #error { color: #ffb4a4; }
      footer { position: fixed; bottom: 24px; right: 28px; padding: 8px 12px; border-radius: 8px; background: #091425b0; color: #d9e5f2; font-size: 11px; pointer-events: none; }
      @media (max-width: 650px) { main { margin: 12px; width: 290px; padding: 18px; max-height: 64vh; } footer { left: 12px; right: auto; bottom: 12px; } }
    </style>
  </head>
  <body>
    <canvas id="sky" aria-label="Interactive Earth sky; drag to look around"></canvas>
    <main>
      <a href="index.html">← World explorer</a>
      <p class="eyebrow">Molen / Celestial systems</p>
      <h1>Sky observatory</h1>
      <p>A place, a moment, an entire sky.<br />Drag the view to follow the light.</p>
      <label for="world">World</label>
      <select id="world"><option value="earth">Earth · geographic sky</option><option value="custom">Amethyst · authored sky</option></select>
      <div class="row">
        <div><label for="latitude">Latitude °N</label><input id="latitude" type="number" min="-90" max="90" step="0.01" value="47.6" /></div>
        <div><label for="longitude">Longitude °E</label><input id="longitude" type="number" min="-180" max="180" step="0.01" value="-122.3" /></div>
      </div>
      <label for="date">Date & time · UTC</label><input id="date" type="datetime-local" step="1" value="2024-06-21T04:00:00" />
      <div class="row actions"><button id="now" type="button">Use current time</button><button id="night" type="button">Full moon night</button></div>
      <label for="speed">Time flow</label>
      <select id="speed"><option value="0">Paused</option><option value="1">Real time</option><option value="60">1 minute / second</option><option value="600" selected>10 minutes / second</option><option value="3600">1 hour / second</option><option value="-600">Reverse · 10 minutes / second</option></select>
      <label for="size">Sun & Moon display size</label><select id="size"><option value="1">True angular size</option><option value="3" selected>3× · easier to inspect</option></select>
      <div class="row actions"><button id="sun" type="button">Face Sun</button><button id="moon" type="button">Face Moon</button></div>
      <output id="readout" aria-live="off"></output>
      <p id="error" role="status"></p>
      <p>Clear sky only. Positions are approximate. The Moon’s surface is procedural. No weather or distance haze.</p>
    </main>
    <footer>Drag to look · Earth positions / J2000 star catalog</footer>
    <script type="module" src="/src/sky-observatory.ts"></script>
  </body>
</html>
