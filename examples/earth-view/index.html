<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>molen — earth view</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc4df; }
      #stage { position: relative; width: 100vw; height: 100vh; }
      #view { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #modes {
        position: absolute; top: 16px; left: 16px; display: flex; gap: 6px;
      }
      #modes button {
        padding: 7px 12px; border: 1px solid rgb(0 0 0 / 20%); border-radius: 6px;
        background: rgb(255 255 255 / 90%); font: 600 13px/1 inherit; cursor: pointer;
      }
      #modes button[aria-pressed='true'] { background: #1d4f63; color: white; }
      #message {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%); margin: 0;
        padding: 6px 12px; border-radius: 6px; background: rgb(12 24 35 / 85%); color: white;
        font-size: 13px;
      }
      #credit {
        position: absolute; right: 0; bottom: 0; margin: 0; padding: 2px 6px;
        background: rgb(255 255 255 / 80%); color: #222; font-size: 11px;
      }
      #credit a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view" tabindex="0" aria-label="3D view of Sammamish, Washington"></canvas>
      <div id="modes">
        <button type="button" data-mode="orbit" aria-pressed="true">Orbit</button>
        <button type="button" data-mode="walk" aria-pressed="false">Walk</button>
        <button type="button" data-mode="drive" aria-pressed="false">Drive</button>
      </div>
      <p id="message" hidden></p>
      <p id="credit"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
