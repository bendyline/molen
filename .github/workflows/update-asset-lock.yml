name: Update asset lock

# Manually triggered. Builds every repository GLB on the same Ubuntu x64 runner as the Assets
# workflow, rewrites asset-lock.json and the metadata the generators regenerate, and commits them
# to the branch. This is the only lock writer: other hosts can build some models to different
# bytes, so `pnpm assets:build --update-lock` refuses to run off Linux x64. See
# content/ASSET-PACKS.md.
on:
  workflow_dispatch:

concurrency: update-asset-lock-${{ github.ref }}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # ~18 GB of GLBs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r examples/lantern-dungeon/tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets:build --compile --update-lock
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-build-report
          path: |
            .artifacts/asset-build/report.json
            .artifacts/asset-build/logs/
          retention-days: 14
      # The lock, regenerated metadata and any GLB Git still tracks. Ignored GLBs stay out.
      - name: Commit the lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- asset-lock.json content assets examples
          if git diff --cached --quiet; then
            echo "asset-lock.json already matches the source"
          else
            git commit -m "chore: update asset lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
