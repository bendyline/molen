name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >=11.5.1. Keep this pinned alongside the release toolchain.
      - run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/fetch-assets
      - run: pnpm build
      # All release checks are also reachable from `pnpm all` locally.
      - run: pnpm verify
      - run: pnpm docs:site:check
      # Verify that Pages is enabled before publishing packages, then build the entire site.
      # Publishing rebuilds it after stamping new versions; on a run that publishes nothing,
      # this build is the artifact that gets deployed.
      - uses: actions/configure-pages@v5
      - run: pnpm docs:site:build
      # Each package has its own version line. multi-semantic-release stamps, changelogs and
      # tags every package with releasable commits, and every package whose Molen dependencies
      # release (see .releaserc.cjs and scripts/semantic-release-molen.mjs). Nothing publishes
      # in this step.
      - name: Version packages
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec multi-semantic-release --ignore-private-packages
      # Rebuild and verify with the stamped versions, then publish every version npm does not
      # have yet, dependencies first. npm's CLI exchanges this job's OIDC identity for a
      # short-lived publish credential.
      - name: Publish packages
        run: node scripts/publish-release.mjs
      # Record the stamped versions in one commit, after publishing and even when publishing
      # failed: the tags are already pushed, and rerunning the workflow publishes what is still
      # missing at these versions. The commit is authored as GitHub's own Actions bot, the
      # identity GITHUB_TOKEN pushes as.
      - name: Commit release metadata
        if: ${{ !cancelled() && steps.version.outcome != 'skipped' }}
        run: |
          shopt -s nullglob
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/*/package.json packages/*/CHANGELOG.md packages/kernel/src/version.ts docs-src/llms.txt docs-src/guide/determinism.md
          if git diff --cached --quiet; then
            echo "No release metadata changed."
            exit 0
          fi
          released=$(git tag --points-at HEAD | sed 's/^/- /')
          git commit -m 'chore(release): update package versions [skip ci]' ${released:+-m "$released"}
          git push origin HEAD:main
      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist/

  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
