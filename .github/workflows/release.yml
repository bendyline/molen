name: Release

# npm packages only. They hold the code tsdown compiles and no content, so this reads no GLB, builds
# no content pack and repeats no check: CI is the gate (scripts/require-green-ci.mjs). molen.dev and
# the content packs are the Site workflow's, which the last step starts.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # About ten minutes of work. A hang must not hold the tags it pushed for GitHub's six hours.
    timeout-minutes: 45
    permissions:
      # Tags and the metadata commit.
      contents: write
      # npm trusted publishing. Its publisher names this file, so packages publish from here only.
      id-token: write
      # Read CI's result; start the Site workflow.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >=11.5.1. Keep this pinned alongside the release toolchain.
      - run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      # Nothing is tagged until the packages compile here.
      - run: pnpm -r --filter './packages/**' exec tsdown
      # Each package has its own version line. multi-semantic-release stamps, changelogs and
      # tags every package with releasable commits, and every package whose Molen dependencies
      # release (see .releaserc.cjs and scripts/semantic-release-molen.mjs). Nothing publishes
      # in this step. semantic-release does not retry a refused push, so git runs through
      # scripts/git-push-retry.sh here, which retries `git push`.
      - name: Version packages
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shim="$RUNNER_TEMP/git-push-retry"
          mkdir -p "$shim"
          install -m 755 scripts/git-push-retry.sh "$shim/git"
          export REAL_GIT="$(command -v git)"
          export PATH="$shim:$PATH"
          pnpm exec multi-semantic-release --ignore-private-packages
      # Record the stamped versions in one commit as soon as their tags are on GitHub, before
      # anything publishes: whatever stops this run after it, a rerun has nothing new to version
      # and publishes what is still missing from npm. It runs even when versioning stopped
      # partway or the run was cancelled or timed out, and records only the packages whose tags
      # reached GitHub (scripts/stage-release-metadata.mjs); the rerun versions the rest. The
      # commit is authored as GitHub's own Actions bot, the identity GITHUB_TOKEN pushes as.
      - name: Commit release metadata
        id: metadata
        if: ${{ always() && steps.version.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          released=$(node scripts/stage-release-metadata.mjs)
          if git diff --cached --quiet; then
            echo "No release metadata changed."
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore(release): update package versions [skip ci]' ${released:+-m "$released"}
          commit=$(node scripts/push-release-commit.mjs)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # Compile with the stamped versions, then pack, check and publish every version npm does not
      # have yet, dependencies first. npm's CLI exchanges this job's OIDC identity for a
      # short-lived publish credential.
      - name: Publish packages
        run: node scripts/publish-release.mjs
      # The site quotes the new versions and the packs follow the packages that read them. It is
      # its own run: rebuilding it for an hour cannot hold back or undo a package release. A
      # workflow_dispatch is the one event GITHUB_TOKEN may start a workflow with.
      - name: Start the Site workflow
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.metadata.outputs.commit }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main -f commit="$COMMIT"
