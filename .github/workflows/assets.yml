name: Assets

# Builds every repository GLB from checked-in source on a clean checkout (nothing is downloaded)
# and requires the bytes to match asset-lock.json. On main it then publishes that snapshot as the
# release the lock names, which `pnpm assets:fetch` and the other workflows download. A pull
# request that changes models commits the lock from `pnpm assets:build --update-lock`; this job
# proves the source still builds to it. See content/ASSET-PACKS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so runner-image or dependency drift that changes a byte surfaces on its own.
    - cron: '23 7 * * 1'

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      # Creating the snapshot release on main. Pull requests only read.
      contents: write
    steps:
      # ~18 GB of GLBs plus ~5 GB of archives when publishing.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r examples/lantern-dungeon/tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      # Compile the packages the generators import, run every generator and import, then compare
      # each GLB with asset-lock.json. Regenerated metadata that differs from Git is annotated.
      - run: pnpm assets:build --compile
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-build-report
          path: |
            .artifacts/asset-build/report.json
            .artifacts/asset-build/logs/
          retention-days: 14
      # Idempotent: an already published snapshot is left as it is.
      - name: Publish the snapshot release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm assets:publish --target "$GITHUB_SHA"
