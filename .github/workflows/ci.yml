name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The checks that need no repository GLBs, so a type, lint or docs error surfaces in minutes
  # instead of after the asset build. It has no `needs` and nothing restores GLBs here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Plain tsdown compiles every package's dist for tsc and the docs check. The full package
      # builds also run content validators that read GLBs (validate-structure-materials opens
      # every source.glb); `unit`'s `pretest:unit` runs those once the bundle is restored.
      - run: pnpm -r --filter './packages/**' exec tsdown
      - run: pnpm -r typecheck
      - run: pnpm lint
      # docs-src/schemas/*.md is generated from the built registries; fail if it is stale.
      - run: pnpm docs:check
      # Asset/source-bundle tests run on fixtures; `preassets:test` builds the schema they read.
      - run: pnpm assets:test
      - run: pnpm audit:prod

  # Restores the bundle for these asset inputs, building it if none exists yet. A build starts
  # from the newest earlier one (see .github/actions/fetch-assets), so a pull request that changes
  # a few models rebuilds those models, not all of them. The bundle then goes to the jobs below as
  # this run's `asset-bundle` artifact.
  assets:
    runs-on: ubuntu-latest
    outputs:
      assets-unpublished: ${{ steps.release.outputs.unpublished }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: assets
        uses: ./.github/actions/fetch-assets
      # Fail here, not in the jobs below, when the commit's sidecars do not describe these GLBs.
      # Those jobs install the bundle into a clean checkout, so a sidecar this build rewrote has
      # to be committed first. The bundle is cached by now: a push that commits it reuses it.
      - run: pnpm assets:check --committed
      # The sidecars to commit, as a patch for `git apply`. There is none if anything else failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asset-sidecars
          path: .artifacts/asset-build/sidecars.patch
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      # Hand the checked bundle to the jobs that wait for this one. An artifact belongs to the
      # run, so nothing another job saves can evict it, and its size has no 10 GB ceiling: the
      # Actions cache lost the bundle between this job and the next ones (see restore-assets).
      - uses: actions/upload-artifact@v4
        with:
          name: asset-bundle
          path: .artifacts/asset-packs/
          # `.artifacts` is a hidden directory.
          include-hidden-files: true
          # The archives are gzip already; storing them as they are is much faster.
          compression-level: 0
          if-no-files-found: error
          # "Re-run all jobs" uploads again under the same name.
          overwrite: true
          # Long enough to re-run failed jobs the next day; about 8 GB a run is not kept longer.
          retention-days: 2
      # Source bundles are part of `pnpm verify`, the release gate; CI runs the same checks. They
      # hash source and runtime GLBs, and read the schema's dist.
      - run: pnpm --filter @bendyline/molen-schema build
      - run: pnpm source:check
      # Ask GitHub for the release rather than whether this run built the bundle: an earlier push
      # may have built it and failed to publish it, and then it comes back from the Actions cache.
      # A failed lookup counts as unpublished; publishing checks again.
      - id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.assets.outputs.release }}
        run: |
          if [ "$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != 'false' ]; then
            echo 'unpublished=true' >> "$GITHUB_OUTPUT"
          fi

  publish-assets:
    # A push to main whose asset inputs name no published release: `assets` uploaded their bundle
    # as this run's artifact, so publish it as that release. Idempotent; other runs then download
    # it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.assets.outputs.assets-unpublished == 'true'
    runs-on: ubuntu-latest
    needs: assets
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This job needs the archives, not the GLBs, so it downloads them without restore-assets.
      - uses: ./.github/actions/prepare-asset-runner
      - uses: actions/download-artifact@v4
        with:
          name: asset-bundle
          path: .artifacts/asset-packs/
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm assets:publish --target "$GITHUB_SHA"

  # The jobs below read repository GLBs. They wait for `assets`, which uploads this commit's bundle
  # as the run's artifact for them to install offline (.github/actions/restore-assets), and for
  # `check`, so a failed fast check spends no runners on them. None of them downloads a release
  # or builds: only `assets` does. `assets` itself keeps building when `check` fails, so the next
  # push can start from it.
  docs-site:
    # The molen.dev site generates its API reference from the built `.d.mts`, its CLI/MCP
    # reference from OPS_CATALOG and its sample pages from examples/. Building it proves those
    # generators still run and that no page carries a dead link or unescaped markup.
    runs-on: ubuntu-latest
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # Fails if .vitepress/generated-nav.json is stale (a new export, op, guide or sample).
      - run: pnpm docs:site:check
      - run: pnpm docs:site:build

  # Exact native-math regression hashes use the same Node/V8 as local checks and Release.
  unit:
    runs-on: ubuntu-latest
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # Kernel unit tests include the deterministic replay-hash suite. `pretest:unit` builds first:
      # the full package builds, including the GLB-reading validators that `check` skips.
      - run: pnpm test:unit

  packed:
    # Keep Node 22 compatibility coverage separate from Node-version-specific regression hashes.
    # What a user gets from npm: pack the release tarballs (with the release's manifest and
    # content checks), install them with npm into a fresh project beside the newest three.js the
    # peer range allows, import every entry point, run the installed CLI's scaffold loop, and read
    # content packs with the packages. See scripts/smoke-packed.mjs.
    runs-on: ubuntu-latest
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # Packing consumes library dist, not browser apps or their multi-gigabyte content packs.
      - run: pnpm -r --filter './packages/**' build
      - run: pnpm smoke:packed

  golden:
    runs-on: ubuntu-24.04
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # The render tests carry no reference images, so this runner records nothing of its own.
      - run: pnpm exec playwright install --with-deps chromium
      # `pretest:golden` builds first. These CPU-only runners find a SwiftShader WebGPU adapter
      # but lose the device on the explorer's scenes (blank canvas, "Instance dropped"), so
      # WebGPU cases skip here and every WebGL and fallback case still runs. Run them locally or
      # on a GPU runner; see docs-src/guide/rendering-backends.md.
      - name: Golden tests with resource diagnostics
        run: node scripts/run-golden-diagnostics.mjs -- pnpm test:golden
        env:
          MOLEN_SKIP_WEBGPU: '1'
          # The explorer's content packs are read locally here, so skip deflating about 2 GB of
          # models in JavaScript: 90% of their build, 13 of this job's minutes.
          MOLEN_PACK_COMPRESSION: store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-diagnostics
          path: .artifacts/golden-ci/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: golden-diffs
          # Most golden tests live under examples/ — omitting them meant the common failure
          # (an example's frame drifted) uploaded nothing to look at.
          path: |
            packages/*/test/golden/__output__/**
            examples/*/test/golden/__output__/**
          retention-days: 7
