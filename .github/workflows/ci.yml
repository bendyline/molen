name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The checks that need no repository GLBs, so a type, lint or docs error surfaces in minutes
  # instead of after the asset build. It has no `needs` and nothing restores GLBs here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Plain tsdown compiles every package's dist for tsc and the docs check. The full package
      # builds also run content validators that read GLBs (validate-structure-materials opens
      # every source.glb); `unit`'s `pretest:unit` runs those once the bundle is restored.
      - run: pnpm -r --filter './packages/**' exec tsdown
      - run: pnpm -r typecheck
      - run: pnpm lint
      # docs-src/schemas/*.md is generated from the built registries; fail if it is stale.
      - run: pnpm docs:check
      # Asset/source-bundle tests run on fixtures; `preassets:test` builds the schema they read.
      - run: pnpm assets:test
      - run: pnpm audit:prod

  # Restores the bundle for these asset inputs, building it if none exists yet. A build starts
  # from the newest earlier one (see .github/actions/fetch-assets), so a pull request that changes
  # a few models rebuilds those models, not all of them.
  assets:
    runs-on: ubuntu-latest
    outputs:
      assets-built: ${{ steps.assets.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: assets
        uses: ./.github/actions/fetch-assets
      - run: pnpm assets:check
      # Source bundles are part of `pnpm verify`, the release gate; CI runs the same checks. They
      # hash source and runtime GLBs, and read the schema's dist.
      - run: pnpm --filter @bendyline/molen-schema build
      - run: pnpm source:check

  publish-assets:
    # A push to main whose asset inputs had no bundle: `assets` built and packed it, so publish it
    # as the release those inputs name. Idempotent; other runs then download it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.assets.outputs.assets-built == 'true'
    runs-on: ubuntu-latest
    needs: assets
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: key
        run: echo "release=$(node scripts/asset-packs.mjs key)" >> "$GITHUB_OUTPUT"
      # This job restores archives directly instead of using fetch-assets.
      - uses: ./.github/actions/prepare-asset-runner
      - uses: actions/cache/restore@v4
        with:
          path: .artifacts/asset-packs/
          key: molen-assets-${{ steps.key.outputs.release }}
          fail-on-cache-miss: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm assets:publish --target "$GITHUB_SHA"

  # The jobs below read repository GLBs. They wait for `assets`, which leaves this commit's bundle
  # in the Actions cache for them to restore offline, and for `check`, so a failed fast check
  # spends no runners on them. `assets` itself keeps building, so the next push can start from it.
  docs-site:
    # The molen.dev site generates its API reference from the built `.d.mts`, its CLI/MCP
    # reference from OPS_CATALOG and its sample pages from examples/. Building it proves those
    # generators still run and that no page carries a dead link or unescaped markup.
    runs-on: ubuntu-latest
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/fetch-assets
      # Fails if .vitepress/generated-nav.json is stale (a new export, op, guide or sample).
      - run: pnpm docs:site:check
      - run: pnpm docs:site:build

  # Exact native-math regression hashes use the same Node/V8 as local checks and Release.
  unit:
    runs-on: ubuntu-latest
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/fetch-assets
      # Kernel unit tests include the deterministic replay-hash suite. `pretest:unit` builds first:
      # the full package builds, including the GLB-reading validators that `check` skips.
      - run: pnpm test:unit

  packed:
    # Keep Node 22 compatibility coverage separate from Node-version-specific regression hashes.
    # What a user gets from npm: pack the release tarballs (with the release's manifest and
    # content checks), install them with npm into a fresh project beside the newest three.js the
    # peer range allows, import every entry point, run the installed CLI's scaffold loop, and read
    # content packs with the packages. See scripts/smoke-packed.mjs.
    runs-on: ubuntu-latest
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/fetch-assets
      # Packing consumes library dist, not browser apps or their multi-gigabyte content packs.
      - run: pnpm -r --filter './packages/**' build
      - run: pnpm smoke:packed

  golden:
    runs-on: ubuntu-24.04
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/fetch-assets
      # The render tests carry no reference images, so this runner records nothing of its own.
      - run: pnpm exec playwright install --with-deps chromium
      # `pretest:golden` builds first. These CPU-only runners find a SwiftShader WebGPU adapter
      # but lose the device on the explorer's scenes (blank canvas, "Instance dropped"), so
      # WebGPU cases skip here and every WebGL and fallback case still runs. Run them locally or
      # on a GPU runner; see docs-src/guide/rendering-backends.md.
      - name: Golden tests with resource diagnostics
        run: node scripts/run-golden-diagnostics.mjs -- pnpm test:golden
        env:
          MOLEN_SKIP_WEBGPU: '1'
          # The explorer's content packs are read locally here, so skip deflating about 2 GB of
          # models in JavaScript: 90% of their build, 13 of this job's minutes.
          MOLEN_PACK_COMPRESSION: store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-diagnostics
          path: .artifacts/golden-ci/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: golden-diffs
          # Most golden tests live under examples/ — omitting them meant the common failure
          # (an example's frame drifted) uploaded nothing to look at.
          path: |
            packages/*/test/golden/__output__/**
            examples/*/test/golden/__output__/**
          retention-days: 7
