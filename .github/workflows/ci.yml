name: CI

# The only gate between main and a release: Release and Site run on commits this passed and repeat
# none of it (scripts/require-green-ci.mjs, scripts/check-release-gate.mjs).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The checks that need no repository GLBs, so a type, lint or docs error surfaces in minutes
  # instead of after the asset build. It has no `needs` and nothing restores GLBs here.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      lods-key: ${{ steps.lods.outputs.key }}
      lods-passed: ${{ steps.lods-passed.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Plain tsdown compiles every package's dist for tsc and the docs check. The full package
      # builds also run content validators that read GLBs (validate-structure-materials opens
      # every source.glb); `unit`'s `pretest:unit` runs those once the bundle is restored.
      - run: pnpm -r --filter './packages/**' exec tsdown
      - run: pnpm -r typecheck
      - run: pnpm lint
      # docs-src/schemas/*.md is generated from the built registries; fail if it is stale.
      - run: pnpm docs:check
      # Asset/source-bundle tests run on fixtures; `preassets:test` builds the schema they read.
      - run: pnpm assets:test
      - run: pnpm audit:prod
      # Whether the landmark LOD suites (`lods`) already passed on exactly what they read.
      - id: lods
        run: echo "key=lod-tests-$(node scripts/lod-test-inputs.mjs)" >> "$GITHUB_OUTPUT"
      - id: lods-passed
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/lod-tests/
          key: ${{ steps.lods.outputs.key }}
          lookup-only: true

  # This commit's GLBs, published as the release its asset inputs name. Almost always they are
  # already: it then takes as long as computing that name. The jobs below restore them from there.
  assets:
    uses: ./.github/workflows/assets.yml
    permissions:
      contents: write

  # The jobs below read repository GLBs. They wait for `assets`, which has published this commit's
  # bundle, and for `check`, so a failed fast check spends no runners on them. None of them builds
  # GLBs. `assets` itself keeps building when `check` fails, so the next push can start from it.
  content:
    # The GLBs, sidecars and source bundles of this checkout agree with each other.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      - run: pnpm assets:check
      # Hashes source and runtime GLBs, and reads the schema's dist.
      - run: pnpm --filter @bendyline/molen-schema build
      - run: pnpm source:check

  docs-site:
    # The molen.dev site generates its API reference from the built `.d.mts`, its CLI/MCP
    # reference from OPS_CATALOG and its sample pages from examples/. Building it proves those
    # generators still run and that no page carries a dead link or unescaped markup.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # Fails if .vitepress/generated-nav.json is stale (a new export, op, guide or sample).
      - run: pnpm docs:site:check
      - run: pnpm docs:site:build

  # Exact native-math regression hashes use the same Node/V8 as local checks.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # Kernel unit tests include the deterministic replay-hash suite. `pretest:unit` builds first:
      # the full package builds, including the GLB-reading validators that `check` skips.
      - run: pnpm test:unit

  lods:
    # The landmark LOD suites regenerate detail levels of real landmarks: 310 of tooling's test
    # files and nearly all of its test time. They depend on content and geometry code, so they run
    # when those changed (scripts/lod-test-inputs.mjs) and not for every commit.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check, assets]
    if: needs.check.outputs.lods-passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      - run: pnpm test:lods --shard=${{ matrix.shard }}/3

  lods-passed:
    # Remember that every shard passed on these inputs. Losing this note only costs a rerun.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, lods]
    steps:
      - run: mkdir -p .artifacts/lod-tests && echo "$GITHUB_SHA" > .artifacts/lod-tests/passed
      - uses: actions/cache/save@v4
        with:
          path: .artifacts/lod-tests/
          key: ${{ needs.check.outputs.lods-key }}

  packed:
    # Keep Node 22 compatibility coverage separate from Node-version-specific regression hashes.
    # What a user gets from npm: pack the release tarballs (with the release's manifest and
    # content checks), install them with npm into a fresh project beside the newest three.js the
    # peer range allows, import every entry point, run the installed CLI's scaffold loop, and read
    # content packs with the packages. See scripts/smoke-packed.mjs.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # Packing consumes library dist, not browser apps or their multi-gigabyte content packs.
      - run: pnpm -r --filter './packages/**' build
      - run: pnpm smoke:packed

  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [check, assets]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/restore-assets
      # The render tests carry no reference images, so this runner records nothing of its own.
      - run: pnpm exec playwright install --with-deps chromium
      # `pretest:golden` builds first. These CPU-only runners find a SwiftShader WebGPU adapter
      # but lose the device on the explorer's scenes (blank canvas, "Instance dropped"), so
      # WebGPU cases skip here and every WebGL and fallback case still runs. Run them locally or
      # on a GPU runner; see docs-src/guide/rendering-backends.md.
      - name: Golden tests with resource diagnostics
        run: node scripts/run-golden-diagnostics.mjs -- pnpm test:golden
        env:
          MOLEN_SKIP_WEBGPU: '1'
          # The explorer's content packs are read locally here, so skip deflating about 2 GB of
          # models in JavaScript: 90% of their build, 13 of this job's minutes.
          MOLEN_PACK_COMPRESSION: store
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-diagnostics
          path: .artifacts/golden-ci/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: golden-diffs
          # Most golden tests live under examples/ — omitting them meant the common failure
          # (an example's frame drifted) uploaded nothing to look at.
          path: |
            packages/*/test/golden/__output__/**
            examples/*/test/golden/__output__/**
          retention-days: 7
