name: Restore repository GLBs
description: >-
  Install the published asset bundle that this checkout's asset inputs name. A CI job that reads
  GLBs uses this after `needs: assets`, which published it (.github/workflows/assets.yml). It
  builds nothing: a bundle that is not published fails the job.
runs:
  using: composite
  steps:
    # Run before the download: the archives and the GLBs they expand to both need the space.
    - uses: ./.github/actions/prepare-asset-runner
    - name: Restore GLBs from the bundle's release
      shell: bash
      run: |
        # A release published a moment ago can take a little to be downloadable everywhere.
        for attempt in 1 2 3 4; do
          pnpm assets:fetch --no-build --no-cache && exit 0
          status=$?
          if [ "$status" -ne 3 ]; then exit "$status"; fi
          if [ "$attempt" -lt 4 ]; then sleep 30; fi
        done
        echo "::error::The asset bundle for this checkout is not published. The Assets workflow builds and publishes it; run this again once it has."
        exit 3
