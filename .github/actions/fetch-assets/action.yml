name: Restore repository GLBs
description: >-
  Download the GLB snapshot pinned by asset-lock.json. When the Assets workflow has not published
  that snapshot yet (a pull request that changes models), build it from source instead.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: .artifacts/asset-packs/
        key: molen-glbs-${{ hashFiles('asset-lock.json') }}
    - id: fetch
      name: Restore GLBs from the release
      shell: bash
      run: |
        set +e
        pnpm assets:fetch --no-build
        status=$?
        if [ "$status" -eq 3 ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        exit "$status"
    # Only a completed download is worth caching; a source build leaves no archives.
    - if: steps.cache.outputs.cache-hit != 'true' && steps.fetch.outputs.build != 'true'
      uses: actions/cache/save@v4
      with:
        path: .artifacts/asset-packs/
        key: molen-glbs-${{ hashFiles('asset-lock.json') }}
    # asset-build.json pins the Node major that produced the lock; the job's own Node comes back
    # afterwards, so the rest of the job still tests the version it asked for.
    - if: steps.fetch.outputs.build == 'true'
      id: node
      shell: bash
      run: echo "version=$(node -p process.versions.node)" >> "$GITHUB_OUTPUT"
    - if: steps.fetch.outputs.build == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 24.18.0
    - if: steps.fetch.outputs.build == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - if: steps.fetch.outputs.build == 'true'
      name: Build GLBs from source
      shell: bash
      run: |
        pip install -r examples/lantern-dungeon/tools/requirements.txt
        pnpm assets:build --compile
    - if: steps.fetch.outputs.build == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.node.outputs.version }}
