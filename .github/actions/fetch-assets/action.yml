name: Restore repository GLBs
description: >-
  Restore the asset bundle named by this checkout's asset inputs (scripts/asset-inputs.mjs):
  from the Actions cache, else from its GitHub release, else by building it from source when no
  bundle exists for these inputs yet (a pull request that changes models).
outputs:
  built:
    description: "'true' when this job built the bundle from source."
    value: ${{ steps.fetch.outputs.build == 'true' }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "release=$(node scripts/asset-packs.mjs key)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: .artifacts/asset-packs/
        key: molen-assets-${{ steps.key.outputs.release }}
    - id: fetch
      name: Restore GLBs from the bundle
      shell: bash
      run: |
        set +e
        if [ "${{ steps.cache.outputs.cache-hit }}" = 'true' ]; then
          pnpm assets:fetch --no-build --offline
        else
          pnpm assets:fetch --no-build
        fi
        status=$?
        if [ "$status" -eq 3 ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        exit "$status"
    # asset-build.json pins the Node major the committed metadata was generated with; the job's
    # own Node comes back afterwards, so the rest of the job still tests the version it asked for.
    - if: steps.fetch.outputs.build == 'true'
      id: node
      shell: bash
      run: echo "version=$(node -p process.versions.node)" >> "$GITHUB_OUTPUT"
    - if: steps.fetch.outputs.build == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 24.18.0
    - if: steps.fetch.outputs.build == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - if: steps.fetch.outputs.build == 'true'
      name: Build GLBs from source
      shell: bash
      run: |
        pip install -r examples/lantern-dungeon/tools/requirements.txt
        pnpm assets:build --compile
        # Make the build restorable before its release exists: dependent jobs and reruns restore
        # it offline, and on main the publish job uploads these archives.
        pnpm assets:pack
    - if: steps.fetch.outputs.build == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.node.outputs.version }}
    # A pull request that only downloaded the release reads main's cache instead of saving a copy.
    - if: >-
        steps.cache.outputs.cache-hit != 'true' &&
        (steps.fetch.outputs.build == 'true' || github.ref == 'refs/heads/main')
      uses: actions/cache/save@v4
      with:
        path: .artifacts/asset-packs/
        key: molen-assets-${{ steps.key.outputs.release }}
