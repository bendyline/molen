name: Prepare runner disk for assets
description: Free space for asset archives, restored GLBs and built content packs on hosted Linux runners.
runs:
  using: composite
  steps:
    - name: Free disk space
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        # A bundle's GLBs are about 35 GB, beside the archives being restored and the content
        # packs built from them. These preinstalled SDKs are unused by Molen.
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /
