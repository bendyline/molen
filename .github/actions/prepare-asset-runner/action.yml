name: Prepare runner disk for assets
description: Free space for asset archives, restored GLBs and built content packs on hosted Linux runners.
runs:
  using: composite
  steps:
    - name: Free disk space
      if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        # Asset cache extraction needs space for both its download and the restored archives,
        # before assets:fetch expands the GLBs. These preinstalled SDKs are unused by Molen.
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /
